<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/base.css">
    <link rel="stylesheet" href="../CSS/characterSelect.css">
    <link rel="stylesheet" href="../CSS/mapSelect.css">
    <link rel="stylesheet" href="../CSS/leaderboard.css">
    <title>Sidewalk Sluggers</title>
</head>
<body>


    <div id="tooltip"></div>

    <div id="startScreen">
        <h1 id="startText">Sidewalk Sluggers</h1>
        <div id="startButton"><p>START</p></div>
        <div id="loadingContainer">
            <div id="loadingBar"></div>
        </div>
    </div>

    <h1 id="title">Sidewalk Sluggers</h1>
    <header>
        <div id="navBar">
            <div id="characterSelectButton" class="activeNav">Character Select</div>
            <div id="mapSelectButton">Map Select</div>
            <div id="leaderboardButton">Leaderboard</div>
        </div>
    </header>

    <main>
        <div id="playerOne">
            <div id="characterFullP1"></div>
            <div id="statsP1">
            </div>
        </div>
        <div id="vsSpace">
            <div id="imgSpace">
                <img src="../Images/RadarChart.png">
            </div>
        </div>
    <div id="playerTwo">
        <div id="statsP2">

        </div> 
        <div id="characterFullP2"></div>
    </div>
        
    </main>
    <div id="characterSelect">

    </div>



    
    <div id="mapMain">
        <div id="mapSelectionCarusel">
            <button class="carouselButton" id="previousButton" data-carousel-button="prev">◀</button>
            <button class="carouselButton" id="nextButton" data-carousel-button="next">▶</button>

            <div class="slide active" id="1">
                <img src="https://images.unsplash.com/photo-1539037116277-4db20889f2d4?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Test">
                <p>Madrid #1</p>
            </div>
            <div class="slide right" id="2">
                <img src="https://images.unsplash.com/photo-1543783207-ec64e4d95325?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Test">
                <p>Madrid #2</p>
            </div>
            <div class="slide" id="3">
                <img src="https://images.unsplash.com/photo-1509845350455-fb0c36048db1?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Test">
                <p>Madrid #3</p>
            </div>
            <div class="slide" id="4">
                <img src="https://images.unsplash.com/photo-1518620121781-adab13a3d1ef?q=80&w=930&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Test">
                <p>Madrid #4</p>
            </div>
            <div class="slide left" id="5">
                <img src="https://images.unsplash.com/photo-1564565946561-e738711bdbd1?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Test">
                <p>Madrid #5</p>
            </div>
        </div>
        <div id="pickedMapSidebar">
            <div id="pickedMapSidebarImgBox">
                <img id="pickedImage" src="">
            </div>
            
            <p id="pickedMapName">Name</p>
            <div id="patchBox">
                <p>Patches</p>
                <div id="patchGrid">

                </div>
            </div>
            <div id="backButton">Back</div>
        </div>
        <div class="mapFooter">
            <div id="pickMapButton">Pick Location</div>
            <div id="footerNav">
                <p>Diciplines:</p>

            </div>
            <div id="lollipopGraph">
                
            </div>
        </div>

    </div>

    
    <div id="leaderboardMain">
        <div id="leaderboardPanel">

            <div id="leaderboardTopBar">

                <select id="seasonSelect"></select>

            </div>

            <div id="leaderboardHeader">

                <p>RANK</p>
                <p>FIGHTER</p>
                <p id="totalScore">TOTAL SCORE</p>
               
            </div>

            <div id="leaderboardRows"></div>

        </div>

        <div id="selectedPlayerPanel">
            <h1>Space for ads</h1>
        </div>

        <div id="graphPanel">
            <div id="graphHeader">Score Trend (Top 5 of all time)</div>
            <div id="graphContainer">
                <div id="charContainer">
                </div>
            </div>
        </div>

        <div id="topStatsPanel"></div>
        
    </div>
    <script src="../JS/d3.v7.min.js"></script>
    <script src="../JS/dataset.v2.js"></script>
    
    <script src="../JS/calculateDataSimon.js"></script>
    <script src="../JS/characterSelect.js"></script>
    <script src="../JS/mapSelect.js"></script>
    <script src="../JS/leaderboard.js"></script>
    <script src="../JS/calculateDataRobin.js"></script>

    
</body>
</html>
